<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <g id="sketch">
      <rect x="0" y="0" width="190" height="250" rx="14" fill="#F5F1EA" stroke="#1B2A41" stroke-width="5"/>
      <rect x="22" y="24" width="146" height="34" rx="6" fill="none" stroke="#1B2A41" stroke-width="4" stroke-dasharray="10 7"/>
      <rect x="22" y="76" width="92" height="70" rx="6" fill="none" stroke="#1B2A41" stroke-width="4"/>
      <line x1="128" y1="84" x2="168" y2="84" stroke="#1B2A41" stroke-width="4" stroke-linecap="round"/>
      <line x1="128" y1="104" x2="160" y2="104" stroke="#1B2A41" stroke-width="4" stroke-linecap="round"/>
      <line x1="128" y1="124" x2="166" y2="124" stroke="#1B2A41" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="172" x2="168" y2="172" stroke="#1B2A41" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="194" x2="132" y2="194" stroke="#1B2A41" stroke-width="4" stroke-linecap="round"/>
      <rect x="22" y="212" width="64" height="20" rx="10" fill="none" stroke="#1B2A41" stroke-width="4"/>
    </g>
    <g id="cross">
      <line x1="10" y1="16" x2="180" y2="236" stroke="#FF6B5A" stroke-width="9" stroke-linecap="round"/>
      <line x1="180" y1="16" x2="12" y2="232" stroke="#FF6B5A" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="screen">
      <rect x="0" y="0" width="150" height="260" rx="22" fill="#1B2A41"/>
      <rect x="14" y="20" width="122" height="44" rx="8" fill="#FF6B5A"/>
      <rect x="14" y="78" width="122" height="66" rx="8" fill="#F5F1EA"/>
      <rect x="14" y="156" width="80" height="10" rx="5" fill="#F5F1EA"/>
      <rect x="14" y="176" width="104" height="10" rx="5" fill="#F5F1EA"/>
      <rect x="14" y="214" width="122" height="30" rx="15" fill="#FF6B5A"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#F5F1EA"/>

  <!-- exploration: the messy middle -->
  <use href="#sketch" transform="translate(110 150) rotate(-9)"/>
  <use href="#sketch" transform="translate(330 110) rotate(6)"/>
  <use href="#cross" transform="translate(330 110) rotate(6)"/>
  <use href="#sketch" transform="translate(150 470) rotate(5)"/>
  <use href="#cross" transform="translate(150 470) rotate(5)"/>
  <use href="#sketch" transform="translate(400 430) rotate(-4)"/>
  <use href="#sketch" transform="translate(560 200) rotate(-12)"/>
  <use href="#cross" transform="translate(560 200) rotate(-12)"/>
  <!-- pencil -->
  <g transform="translate(560 650) rotate(-28)">
    <rect x="0" y="0" width="210" height="30" rx="4" fill="#FF6B5A"/>
    <rect x="186" y="0" width="24" height="30" fill="#1B2A41"/>
    <polygon points="0,0 -40,15 0,30" fill="#F5F1EA" stroke="#1B2A41" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-27,10 -40,15 -27,20" fill="#1B2A41"/>
  </g>

  <!-- divider -->
  <line x1="830" y1="120" x2="830" y2="780" stroke="#1B2A41" stroke-width="4" stroke-dasharray="4 18" stroke-linecap="round" opacity="0.5"/>

  <!-- production: the assembly line -->
  <rect x="900" y="640" width="620" height="54" rx="27" fill="#1B2A41"/>
  <g fill="#F5F1EA">
    <circle cx="935" cy="667" r="14"/>
    <circle cx="1045" cy="667" r="14"/>
    <circle cx="1155" cy="667" r="14"/>
    <circle cx="1265" cy="667" r="14"/>
    <circle cx="1375" cy="667" r="14"/>
    <circle cx="1485" cy="667" r="14"/>
  </g>
  <rect x="950" y="694" width="16" height="110" fill="#1B2A41"/>
  <rect x="1454" y="694" width="16" height="110" fill="#1B2A41"/>
  <use href="#screen" transform="translate(940 380)" opacity="0.35"/>
  <use href="#screen" transform="translate(1135 380)" opacity="0.65"/>
  <use href="#screen" transform="translate(1330 380)"/>
  <!-- motion marks -->
  <g stroke="#FF6B5A" stroke-width="7" stroke-linecap="round">
    <line x1="1500" y1="300" x2="1545" y2="300"/>
    <line x1="1490" y1="330" x2="1550" y2="330"/>
    <line x1="1500" y1="360" x2="1545" y2="360"/>
  </g>
</svg>
